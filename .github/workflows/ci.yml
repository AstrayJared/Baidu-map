name: Submission checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: [0, 1, 2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          # Keep HEAD's parent so `git show --check HEAD` checks this commit,
          # rather than treating a shallow checkout as a new root commit.
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - run: python -m pip install -r backend/requirements.lock.txt -e life-circle-algorithm
      - name: Backend complete regression
        working-directory: backend
        run: python tools/run_test_shard.py --index ${{ matrix.shard }} --count 3
      - name: Algorithm regression
        working-directory: life-circle-algorithm
        run: python -m pytest -q -p no:cacheprovider --basetemp=../backend/logs/algorithm-tmp
      - name: Generated contracts and syntax
        working-directory: backend
        run: |
          python -m tools.export_contract --check
          python -m compileall -q app scripts tools
      - name: Whitespace check
        run: git -c core.whitespace=cr-at-eol show --format= --check HEAD
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-${{ matrix.os }}-${{ matrix.shard }}-failure
          path: backend/logs/
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: life-circle-demo/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.lock.txt -e life-circle-algorithm
      - run: npm ci
        working-directory: life-circle-demo
      - name: Unit tests and build
        working-directory: life-circle-demo
        run: |
          npm test
          npm run build
      - run: npx playwright install --with-deps chromium
        working-directory: life-circle-demo
      - name: Browser UI and backend integration (offline upstream)
        working-directory: life-circle-demo
        env:
          ANALYSIS_TEST_PYTHON: python
        run: |
          npm run test:checkup-ui
          npm run test:integration
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: life-circle-demo/output/
      - name: Record source revision and workflow identity
        if: always()
        working-directory: life-circle-demo
        env:
          CI_JOB_CONCLUSION: ${{ job.status }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          target = Path('output/submission-ci-receipt.json')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps({
              'schemaVersion': 1,
              'headSha': os.environ['GITHUB_SHA'],
              'branch': os.environ['GITHUB_REF_NAME'],
              'runUrl': f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'runAttempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'job': os.environ['GITHUB_JOB'],
              'jobConclusion': os.environ['CI_JOB_CONCLUSION'],
              'acceptance': 'Confirm all six backend jobs and the frontend job succeeded at this same headSha; this receipt alone is not overall success.'
          }, indent=2) + '\n', encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: submission-ci-receipt
          path: life-circle-demo/output/submission-ci-receipt.json
