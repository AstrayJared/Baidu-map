name: Repository layout

# 这个仓库此前没有任何 workflow，"文档搬了、引用没跟着改"和"工作区里多了一份没登记的
# 嵌套仓库"这两类问题只能靠人眼发现。检查本身在 scripts/check_repo_layout.py 里，本地
# 与 CI 跑的是同一份代码，所以本地跑绿了 CI 不会另有说法。

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查器自检（证明它会失败，而不是永远通过）
        run: python3 scripts/test_check_repo_layout.py

      - name: 仓库布局检查（文档链接、gitlink、忽略规则、行尾）
        run: python3 scripts/check_repo_layout.py

      - name: 提交里不能带空白错误或冲突标记
        run: git show --check --format= HEAD
